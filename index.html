document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

border:1px solid hsl(var(--brand)/.5);background:hsl(var(--brand)/.14);border-radius:14px;padding:13px 14px;font-size:13.5px;color:hsl(180 30% 24%)\">La semana pinta equilibrada. 👌<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ bal.hasReal }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"padding:0 4px 9px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:hsl(var(--muted-foreground))\">Planificado vs comido<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px\">\n          <sc-for list=\"{{ bal.real }}\" as=\"r\" hint-placeholder-count=\"2\">\n            <div style=\"border:1px solid hsl(var(--border));border-radius:14px;padding:12px 13px\">\n              <div style=\"font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:hsl(var(--muted-foreground))\">{{ r.day }}<\u002Fdiv>\n              <div style=\"margin-top:5px;font-size:13px;color:hsl(var(--muted-foreground));text-decoration:line-through\">{{ r.planned }}<\u002Fdiv>\n              <div style=\"margin-top:3px;font-size:14.5px;font-weight:600\">{{ r.eaten }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"padding:0 4px 0\">\n      <sc-if value=\"{{ bal.hasHistory }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-bottom:14px\">\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:hsl(var(--muted-foreground));padding-bottom:8px\">Historial<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <sc-for list=\"{{ bal.history }}\" as=\"h\" hint-placeholder-count=\"1\">\n              <div style=\"display:flex;justify-content:space-between;gap:10px;font-size:12.5px;border:1px solid hsl(var(--border));border-radius:12px;padding:10px 12px\">\n  style=\"font-size:16px;line-height:1\">📅<\u002Fspan><span style=\"font-size:9.5px;font-weight:650\">Semana<\u002Fspan>\n  <\u002Fbutton>\n  <button sc-camel-on-click=\"{{ goCompra }}\" style=\"border:none;background:{{ nav.compraBg }};border-radius:14px;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:54px;color:{{ nav.compraFg }};position:relative\">\n    <span style=\"font-size:16px;line-height:1\">🛒<\u002Fspan><span style=\"font-size:9.5px;font-weight:650\">Compra<\u002Fspan>\n    <sc-if value=\"{{ nav.hasPend }}\" hint-placeholder-val=\"{{ true }}\">\n      <span style=\"position:absolute;top:5px;right:calc(50% - 20px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:hsl(var(--brand));color:hsl(var(--brand-foreground));font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center\">{{ nav.pend }}<\u002Fspan>\n    <\u002Fsc-if>\n  <\u002Fbutton>\n  <button sc-camel-on-click=\"{{ goPrep }}\" style=\"border:none;background:{{ nav.prepBg }};border-radius:14px;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:54px;color:{{ nav.prepFg }}\">\n    <span style=\"font-size:16px;line-height:1\">👩‍🍳<\u002Fspan><span style=\"font-size:9.5px;font-weight:650\">Preparar<\u002Fspan>\n  <\u002Fbutton>\n  <button sc-camel-on-click=\"{{ goBalance }}\" style=\"border:none;background:{{ nav.balBg }};border-radius:14px;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:54px;color:{{ nav.balFg }}\">\n    <span style=\"font-size:16px;line-height:1\">💜<\u002Fspan><span style=\"font-size:9.5px;font-weight:650\">Equilibrio<\u002Fspan>\n  <\u002Fbutton>\n<\u002Fnav>\n\n<sc-if value=\"{{ sheetOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n  <div sc-camel-on-click=\"{{ closeSheet }}\" style=\"position:fixed;inset:0;background:rgba(48,48,54,.34);z-index:40;animation:fadeIn .18s ease\"><\u002Fdiv>\n  <div style= und:hsl(var(--background));border:1px solid hsl(var(--border));border-radius:20px;padding:22px;z-index:51\">\n    <div style=\"font-size:17px;font-weight:680;letter-spacing:-.01em\">{{ dialog.title }}<\u002Fdiv>\n    <div style=\"font-size:14px;color:hsl(var(--muted-foreground));margin-top:8px;line-height:1.5\">{{ dialog.body }}<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:20px\">\n      <sc-for list=\"{{ dialog.actions }}\" as=\"a\" hint-placeholder-count=\"2\">\n        <button sc-camel-on-click=\"{{ a.onClick }}\" style=\"width:100%;padding:13px;border-radius:12px;border:1px solid {{ a.bd }};background:{{ a.bg }};font-size:14.5px;font-weight:650;color:{{ a.fg }}\">{{ a.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <x-import component-from-global-scope=\"MoicroSocialUI.Button\" variant=\"ghost\" on-click=\"{{ dialog.onCancel }}\" class-name=\"w-full\" hint-size=\"100%,42px\">Cancelar<\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:900},&quot;protagonista&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;comida&quot;,&quot;cena&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;'auto' | 'comida' | 'cena'&quot;,&quot;section&quot;:&quot;Comportamiento&quot;},&quot;mostrarDesayuno&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Comportamiento&quot;},&quot;cicloCompra&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Comprar → Ya tenemos → Comprado&quot;,&quot;Comprar → Comprado&quot;],&quot;default&quot;:&quot;Comprar → Ya tenemos → Comprado&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Compra&quot;}}\">\nclass Component extends DCLogic {\n  DAYS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];\n  MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];\n\n  TEAL = 'hsl(var(--brand))';\n  TEAL_BG = 'hsl(var(--brand)/.14)';\n  TEAL_BD = 'hsl(var(--brand)/.55)';\n  TEAL_INK = 'hsl(180 34% 24%)';\n  LILA_BG = 'hsl(var(--accent)/.2)';\n  LILA_BD = 'hsl(var(--accent))';\n  LILA_INK = 'hsl(262 32% 28%)';\n\n  SHOP = [\n    {cat:'Verduras', icon:'🥬', items:[\n      {id:'calabacines',name:'Calabacines',qty:'4–5'},\n      {id:'calabaza',name:'Calabaza',qty:'700 g – 1 kg'},\n      {id:'patatas',name:'Patatas',qty:'1,5 kg'},\n      {id:'cebollas',name:'Cebollas',qty:'4'},\n      {id:'pimientos',name:'Pimientos',qty:'3'},\n      {id:'tomates',name:'Tomates',qty:'5–6'},\n      {id:'ensalada',name:'Ensalada o lechuga',qty:'1 bolsa'},\n      {id:'champis',name:'Champiñones',qty:'1 bandeja'},\n      {id:'verdura',name:'Verduras para acompañar',qty:''},\n      {id:'ajo',name:'Ajo',qty:'',always:true}]},\n    {cat:'Fruta', icon:'🍌', items:[\n      {id:'platanos',name:'Plátanos',qty:'4',always:true},\n      {id:'manzanas',name:'Manzanas',qty:'4',always:true},\n      {id:'mandarinas',name:'Mandarinas o naranjas',qty:'4',always:true},\n      {id:'peras',name:'Peras',qty:'2',always:true}]},\n    {cat:'Pan y despensa', icon:'🍞', items:[\n      {id:'pitufos',name:'Pan / pitufos de desayuno',qty:'',always:true},\n      {id:'panint',name:'Pan integral',qty:''},\n      {id:'panham',name:'Panes de hamburguesa',qty:'2'},\n      {id:'pizzabase',name:'Base de pizza',qty:''},\n      {id:'triturado',name:'Tomate triturado',qty:''},\n      {id:'atun',name:'Atún',qty:'2 latas'},\n      {id:'cafe',name:'Café',qty:'',always:true}]},\n    {cat:'Huevos y lácteos', icon:'🥚', items:[\n      {id:'huevos',name:'Huevos',qty:'10–12'},\n      {id:'yogures',name:'Yogures proteicos',qty:'6',always:true},\n      {id:'queso',name:'Mozzarella o queso rallado',qty:'150–200 g'}]},\n    {cat:'Carne y pescado', icon:'🥩', items:[\n      {id:'pollo',name:'Pollo',qty:'aprox. 1 kg'},\n      {id:'pinchitos',name:'Pinchitos de cerdo',qty:'500–600 g'},\n      {id:'hamburguesas',name:'Hamburguesas',qty:'2'},\n      {id:'rosada',name:'Rosada',qty:'400–500 g'},\n      {id:'pescado',name:'Pescado para horno',qty:'500–600 g'}]}\n  ];\n\n  DISHES = {\n    d_sopa:{name:'Sopa de verduras',side:'Yogur proteico',made:true,prio:true,ing:[],tags:['verdura'],perfil:'Comida ligera',kind:'comida',prep:[]},\n    d_lentejas:{name:'Lentejas',side:'Yogur proteico',made:true,prio:true,ing:[],tags:['legumbres','proteina','hidratos'],perfil:'Comida completa',kind:'comida',prep:[]},\n    d_puchero:{name:'Puchero',side:'Yogur proteico',made:true,prio:true,ing:[],tags:['legumbres','carne','verdura','proteina'],perfil:'Comida completa',kind:'comida',prep:[]},\n    d_calabaza:{name:'Crema de calabaza',side:'Pollo al horno',ing:['calabaza','cebollas','pollo','patatas'],tags:['verdura','carne','proteina','hidratos'],perfil:'Comida completa',kind:'comida',\n      prep:[{t:'Sacar el pollo del congelador',when:'before'},{t:'Pelar y trocear la calabaza',when:'same'}]},\n    d_pizza:{name:'Pizza sana',side:'',ing:['pizzabase','triturado','queso','champis','pimientos'],tags:['hidratos','verdura'],perfil:'Fuente de hidratos',kind:'comida',\n      prep:[{t:'Rallar el queso para la pizza',when:'same'}]},\n    d_burger:{name:'Hamburguesa',side:'Ensalada',ing:['hamburguesas','panham','ensalada','tomates'],tags:['carne','proteina','hidratos','verdura'],perfil:'Comida completa',kind:'comida',\n      prep:[{t:'Sacar las hamburguesas del congelador',when:'before'},{t:'Lavar la ensalada',when:'same'}]},\n    d_pescado:{name:'Pescado al horno',side:'Patatas + verduras',ing:['pescado','patatas','verdura','cebollas'],tags:['pescado','proteina','verdura','hidratos'],perfil:'Comida completa',kind:'comida',\n      prep:[{t:'Descongelar el pescado',when:'before'},{t:'Pelar las patatas',when:'same'}]},\n    c_pinchito_pan:{name:'Pinchito de cerdo',side:'Pan integral',ing:['pinchitos','panint'],tags:['carne','proteina','hidratos'],perfil:'Alto en proteína',kind:'cena',alt:'a_crema_atun',\n      prep:[{t:'Sacar los pinchitos del congelador',when:'before'}]},\n    c_tortilla_pollo:{name:'Tortilla francesa',side:'Verduras + pollo a la plancha',ing:['huevos','verdura','pollo'],tags:['huevos','carne','proteina','verdura'],perfil:'Alto en proteína',kind:'cena',alt:'a_crema_rosada',\n      prep:[{t:'Sacar el pollo del congelador',when:'before'},{t:'Lavar y trocear la verdura',when:'same'}]},\n    c_pinchito:{name:'Pinchito',side:'',ing:['pinchitos'],tags:['carne','proteina'],perfil:'Alto en proteína',kind:'cena',alt:'a_crema_pollo',\n      prep:[{t:'Sacar el pinchito del congelador',when:'before'}]},\n    c_tortilla_verd:{name:'Tortilla francesa',side:'Verduras',ing:['huevos','verdura'],tags:['huevos','proteina','verdura'],perfil:'Comida ligera',kind:'cena',\n      prep:[{t:'Preparar las verduras',when:'same'}]},\n    c_calabacin_rosada:{name:'Crema de calabacín',side:'Rosada',ing:['calabacines','rosada'],tags:['pescado','proteina','verdura'],perfil:'Comida ligera',kind:'cena',\n      prep:[{t:'Descongelar la rosada',when:'before'},{t:'Hacer la crema de calabacín',when:'same'}]},\n    c_picoteo:{name:'Picoteo',side:'',ing:[],tags:[],perfil:'Comida ligera',kind:'cena',prep:[]},\n    c_pollo_crema:{name:'Pollo a la plancha',side:'Crema de verduras',ing:['pollo','calabacines'],tags:['carne','proteina','verdura'],perfil:'Alto en proteína',kind:'cena',\n      prep:[{t:'Sacar el pollo del congelador',when:'before'},{t:'Hacer la crema de verduras',when:'same'}]},\n    a_crema_atun:{name:'Crema de verduras',side:'Tortilla francesa con atún',ing:['calabacines','huevos','atun'],tags:['pescado','huevos','proteina','verdura'],perfil:'Comida ligera',kind:'cena',\n      prep:[{t:'Hacer la crema de verduras',when:'same'}]},\n    a_crema_rosada:{name:'Crema de verduras',side:'Rosada',ing:['calabacines','rosada'],tags:['pescado','proteina','verdura'],perfil:'Comida ligera',kind:'cena',\n      prep:[{t:'Descongelar la rosada',when:'before'},{t:'Hacer la crema de verduras',when:'same'}]},\n    a_crema_pollo:{name:'Crema de verduras',side:'Pollo a la plancha',ing:['calabacines','pollo'],tags:['carne','proteina','verdura'],perfil:'Alto en proteína',kind:'cena',\n      prep:[{t:'Sacar el pollo del congelador',when:'before'},{t:'Hacer la crema de verduras',when:'same'}]},\n    x_fuera:{name:'Comer fuera',side:'',ing:[],tags:[],perfil:'Sin datos',kind:'both',prep:[]},\n    x_sobras:{name:'Sobras',side:'',ing:[],tags:[],perfil:'Sin datos',kind:'both',prep:[]},\n    x_ensalada:{name:'Ensalada completa',side:'Atún o huevo',ing:['ensalada','tomates','atun','huevos'],tags:['verdura','pescado','proteina'],perfil:'Comida ligera',kind:'both',prep:[]}\n  };\n\n  BASE = {\n    comida:['d_sopa','d_lentejas','d_puchero','d_calabaza','d_pizza','d_burger','d_pescado'],\n    cena:['c_pinchito_pan','c_tortilla_pollo','c_pinchito','c_tortilla_verd','c_calabacin_rosada','c_picoteo','c_pollo_crema']\n  };\n\n  KEY = 'menuSemanal.v2';\n\n  state = {view:'hoy', offset:0, secondaryOpen:false, openDay:null, sheet:null, dialog:null,\n    newItem:'', newTask:'', showOriginal:false, focus:[],\n    plan:{comida:this.BASE.comida.slice(), cena:this.BASE.cena.slice()},\n    status:{}, moved:{}, subs:{}, log:{}, people:{}, orphans:[], locked:{}, satChoice:null,\n    shop:{}, tasks:{}, extraItems:[], extraTasks:[], hidden:[], undo:null, banner:null, history:[]};\n\n  componentDidMount(){\n    try{\n      const raw = localStorage.getItem(this.KEY);\n      if(raw){\n        const d = JSON.parse(raw);\n        const keep = {};\n        ['plan','status','moved','subs','log','people','orphans','locked','satChoice','shop','tasks','extraItems','extraTasks','hidden','history'].forEach(k=>{ if(d[k]!==undefined) keep[k]=d[k]; });\n        this.setState(keep);\n      }\n    }catch(e){}\n    this.tick = setInterval(()=>this.forceUpdate(), 60000);\n  }\n  componentWillUnmount(){ if(this.tick) clearInterval(this.tick); }\n  componentDidUpdate(){\n    const s = this.state;\n    try{ localStorage.setItem(this.KEY, JSON.stringify({plan:s.plan, status:s.status, moved:s.moved, subs:s.subs,\n      log:s.log, people:s.people, orphans:s.orphans, locked:s.locked, satChoice:s.satChoice, shop:s.shop, tasks:s.tasks, extraItems:s.extraItems,\n      extraTasks:s.extraTasks, hidden:s.hidden, history:s.history})); }catch(e){}\n  }\n\n  snap(){\n    const s = this.state;\n    return JSON.parse(JSON.stringify({plan:s.plan, status:s.status, moved:s.moved, subs:s.subs, log:s.log,\n      orphans:s.orphans, locked:s.locked, satChoice:s.satChoice || null}));\n  }\n  undo(){\n    const u = this.state.undo;\n    if(!u) return;\n    this.setState(Object.assign({}, u, {undo:null, banner:null}));\n  }\n\n  dish(id){ return id ? this.DISHES[id] : null; }\n  dishFull(id){ const d = this.dish(id); return d ? (d.name + (d.side ? ' + ' + d.side : '')) : 'Sin plan'; }\n  planRef(){ return this._plan || this.state.plan; }\n  slotDish(slot, day){ return this.planRef()[slot][day]; }\n  stat(slot, day){ return this.state.status[slot+'-'+day] || 'pend'; }\n  people(id){ return this.state.people[id] || 2; }\n\n  allItems(){\n    const out = [];\n    this.SHOP.forEach(c=>c.items.forEach(i=>out.push(Object.assign({}, i, {cat:c.cat, icon:c.icon}))));\n    this.state.extraItems.forEach(i=>out.push(Object.assign({}, i, {cat:'Añadidos', icon:'✍️', extra:true, always:true})));\n    return out.filter(i=>this.state.hidden.indexOf(i.id) < 0);\n  }\n  itemState(id){ return this.state.shop[id] || 'buy'; }\n  itemName(id){ const it = this.allItems().find(i=>i.id===id); return it ? it.name : id; }\n  usedIngredients(){\n    const set = {};\n    ['comida','cena'].forEach(k=>{\n      for(let d=0;d<7;d++){\n        const id = this.state.plan[k][d];\n        if(!id || this.stat(k,d)==='skip') continue;\n        (this.dish(id).ing||[]).forEach(g=>{ set[g]=true; });\n        const alt = this.dish(id).alt;\n        if(alt) (this.dish(alt).ing||[]).forEach(g=>{ set[g]=true; });\n      }\n    });\n    this.state.orphans.forEach(id=>{ (this.dish(id).ing||[]).forEach(g=>{ set[g]=true; }); });\n    return set;\n  }\n\n  usesFor(ing){\n    const names = [], seen = {};\n    ['comida','cena'].forEach(k=>{\n      for(let d=0;d<7;d++){\n        const id = this.state.plan[k][d];\n        if(!id || this.stat(k,d)==='skip') continue;\n        const dd = this.dish(id);\n        if((dd.ing||[]).indexOf(ing) < 0 || seen[dd.name]) continue;\n        seen[dd.name] = 1; names.push(dd.name);\n      }\n    });\n    return names;\n  }\n\n  setBanner(title, lines){ this.setState({banner:{title:title, lines:lines}}); }\n\n  markEaten(slot, day){\n    const key = slot+'-'+day;\n    const id = this.slotDish(slot, day);\n    this.setState(s=>{\n      const st = Object.assign({}, s.status), log = Object.assign({}, s.log);\n      if(st[key]==='done'){ st[key] = s.subs[key] ? 'sub' : 'pend'; delete log[key]; }\n      else { st[key] = 'done'; log[key] = id; }\n      return {status:st, log:log, sheet:null};\n    });\n  }\n  skipSlot(slot, day){\n    const key = slot+'-'+day;\n    const undo = this.snap();\n    this.setState(s=>{\n      const st = Object.assign({}, s.status);\n      st[key] = st[key]==='skip' ? 'pend' : 'skip';\n      return {status:st, sheet:null, undo:undo,\n        banner:{title:'⏭️ Comida saltada', lines:[{text:this.dishFull(s.plan[slot][day])+' no volverá a aparecer esta semana.'}]}};\n    });\n  }\n  dinnerPool(){\n    const ids = {};\n    this.BASE.cena.forEach(id=>{ ids[id] = 1; });\n    Object.keys(this.DISHES).forEach(id=>{ if(id.indexOf('a_')===0 || id==='x_ensalada') ids[id] = 1; });\n    return Object.keys(ids);\n  }\n  hasTag(id, t){ const d = this.dish(id); return !!d && (d.tags||[]).indexOf(t) >= 0; }\n  isHeavy(id){ const d = this.dish(id); if(!d) return false;\n    return d.perfil==='Fuente de hidratos' || (this.hasTag(id,'hidratos') && (this.hasTag(id,'carne') || this.hasTag(id,'pescado'))); }\n  isLight(id){ const d = this.dish(id); return !!d && d.perfil==='Comida ligera'; }\n\n  scoreDinner(cand, lunchId, day){\n    if(!cand) return -99;\n    const a = this.analyze();\n    let sc = 0;\n    if(this.hasTag(cand,'verdura')){\n      sc += 3;\n      if(lunchId && !this.hasTag(lunchId,'verdura')) sc += 3;\n    }\n    if(lunchId && this.isHeavy(lunchId)){\n      if(this.isLight(cand)) sc += 4;\n      if(this.hasTag(cand,'hidratos')) sc -= 4;\n      if(this.isHeavy(cand)) sc -= 3;\n    }\n    if(lunchId && (this.isLight(lunchId) || !this.hasTag(lunchId,'proteina'))){\n      if(this.hasTag(cand,'proteina')) sc += 3;\n      if(this.hasTag(cand,'hidratos')) sc += 1;\n    }\n    if(lunchId && this.hasTag(lunchId,'legumbres')){\n      if(this.isLight(cand)) sc += 2;\n      if(this.hasTag(cand,'hidratos')) sc -= 2;\n    }\n    ['carne','pescado','huevos','legumbres'].forEach(t=>{\n      if(lunchId && this.hasTag(lunchId,t) && this.hasTag(cand,t)) sc -= (t==='carne' ? 4 : 3);\n    });\n    if(this.hasTag(cand,'pescado') && a.pescado < 2) sc += 3;\n    if(this.hasTag(cand,'legumbres') && a.legumbres < 2) sc += 2;\n    if(this.dishFull(cand).toLowerCase().indexOf('pollo') >= 0 && a.pollo >= 3) sc -= 3;\n    const plan = this.planRef();\n    let rep = 0;\n    for(let i=0;i<7;i++){\n      if(i!==day && plan.cena[i]===cand) rep++;\n      if(plan.comida[i]===cand) rep++;\n    }\n    sc -= rep*2;\n    const base = this.BASE.cena[day];\n    if(cand===base) sc += 3;\n    if(base && this.dish(base).alt===cand) sc += 2;\n    if(this.BASE.cena.indexOf(cand) >= 0) sc += 1;\n    if(cand.indexOf('x_')===0) sc -= 4;\n    const ing = this.dish(cand).ing || [];\n    const missing = ing.filter(g=>this.itemState(g)==='buy').length;\n    if(ing.length && missing===0) sc += 1;\n    sc -= missing;\n    return sc;\n  }\n\n  reasonFor(cand, lunchId){\n    if(lunchId && this.isHeav (sSlot, di, isToday),\n      secondaryOpen: s.secondaryOpen,\n      secondaryChevron: s.secondaryOpen ? '▲' : '▼',\n      toggleSecondary: ()=>this.setState(st=>({secondaryOpen:!st.secondaryOpen})),\n      week: week,\n      showOriginal: s.showOriginal,\n      originalLabel: s.showOriginal ? 'Ocultar plan original' : 'Ver plan original',\n      toggleOriginal: ()=>this.setState(st=>({showOriginal:!st.showOriginal})),\n      originalPlan: this.DAYS.map((n, i)=>({day:n, text:this.dishFull(this.BASE.comida[i]) + ' · ' + this.dishFull(this.BASE.cena[i])})),\n      orphans: s.orphans.map(id=>({name:this.dishFull(id),\n        onPlace: ()=>this.setState({sheet:{kind:'place', id:id, slot:this.dish(id).kind==='cena' ? 'cena' : 'comida'}})})),\n      hasOrphans: s.orphans.length>0,\n      shop: {pct:pct, countLabel: ready+' de '+items.length+' productos listos', cats:cats,\n        bought:bought, hasBought: bought.length>0, boughtCount: bought.length+'',\n        hint: 'Pulsa un producto para cambiarlo: por comprar → ✅ comprado → 🏠 ya lo tenemos.',\n        newItem: s.newItem,\n        onNewItem: (e)=>this.setState({newItem:e.target.value}),\n        onNewItemKey: (e)=>{ if(e.key==='Enter') this.addItem(); },\n        onAdd: ()=>this.addItem()},\n      prep: {headline: pendToday===0 ? 'Todo listo por hoy' : (pendToday===1 ? '1 cosa que preparar' : pendToday+' cosas que preparar'),\n        today: todayTasks, todayEmpty: todayTasks.length===0, rest: rest, hasRest: rest.length>0,\n        night: nightTasks, hasNight: nightTasks.length>0,\n        nightNote: pendNight===0 ? 'Ya está todo sacado.' : (pendNight===1 ? 'Queda 1 cosa por sacar esta noche.' : 'Quedan '+pendNight+' cosas por sacar esta noche.'),\n        newTask: s.newTask,\n        onNewTask: (e)=>this.setState({newTask:e.target.value}),\n        onNewTaskKey: (e)=>{ if(e.key==='Enter') this.addTask(); },\n        onAdd: ()=>this.addTask()},\n      bal: {metrics:metrics, bars:bars, tips:tips.slice(0,3), noTips: tips.length===0,\n        basis: a.done ? ('Con lo que ya habéis comido ('+a.done+') y lo que queda planeado.') : 'Con el plan actual de la semana.',\n        real: realRows, hasReal: realRows.length>0,\n        history: s.history.slice().reverse(), hasHistory: s.history.length>0},\n      askNewWeek: ()=>this.setState({dialog:{kind:'new'}}),\n      restoreBase: ()=>this.setState(st=>({undo:this.snap(),\n        plan:{comida:this.BASE.comida.slice(), cena:this.BASE.cena.slice()},\n        status:{}, moved:{}, subs:{}, log:{}, orphans:[], satChoice:null,\n        banner:{title:'↻ Menú base restaurado', lines:[{text:'El plan vuelve a ser exactamente vuestro menú oficial. La compra y las tareas no se han tocado.'}], change:null}})),\n      nav: {hoyFg:navFg('hoy'), hoyBg:navBg('hoy'), semanaFg:navFg('semana'), semanaBg:navBg('semana'),\n        compraFg:navFg('compra'), compraBg:navBg('compra'), prepFg:navFg('preparar'), prepBg:navBg('preparar'),\n        balFg:navFg('equilibrio'), balBg:navBg('equilibrio'), pend: pend+'', hasPend: pend>0},\n      goHoy: ()=>this.setState({view:'hoy', focus:[]}),\n      goSemana: ()=>this.setState({view:'semana', focus:[]}),\n      goCompra: ()=>this.setState({view:'compra'}),\n      goPrep: ()=>this.setState({view:'preparar', focus:[]}),\n      goBalance: ()=>this.setState({view:'equilibrio', focus:[]}),\n      sheetOpen: !!s.sheet,\n      sheet: {title:sheetTitle, subtitle:sheetSub, actions:actions},\n      closeSheet: ()=>this.setState({sheet:null}),\n      dialog: dialog,\n      banner: {show: !!s.banner, title: s.banner ? s.banner.title : '', lines: s.banner ? s.banner.lines : [],\n        hasChange: !!(s.banner && s.banner.change),\n        onChange: ()=>{ const c = s.banner && s.banner.change; if(c) this.setState({banner:null, sheet:{kind:'lib', slot:c.slot, day:c.day}}); },\n        onClose: ()=>this.setState({banner:null}), onUndo: ()=>this.undo()}\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
